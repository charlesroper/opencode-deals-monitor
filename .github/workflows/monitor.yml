name: Monitor

on:
  schedule:
    # Daily at 08:23 UTC, off the top of the hour to dodge cron jitter.
    - cron: "23 8 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild the public outputs even when nothing changed
        type: boolean
        default: false

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: opencode-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Run the monitor
        id: monitor
        env:
          PUBLIC_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          FORCE_FLAG: ${{ inputs.force == true && '--force' || '' }}
        run: |
          set +e
          if [ "$FORCE_FLAG" = "--force" ]; then
            uv run opencode-monitor --force
          else
            uv run opencode-monitor
          fi
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit state changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/)" ]; then
            git add data/
            git commit -m "chore: update monitor state"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      # GitHub disables scheduled workflows after 60 days without repo
      # activity; push an empty commit well before that can happen.
      - name: Keepalive
        if: steps.commit.outputs.pushed != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          age_days=$(( (now - last) / 86400 ))
          if [ "$age_days" -ge 45 ]; then
            git commit --allow-empty -m "chore: keepalive scheduled monitor"
            git push
          fi

      - name: Check for publishable output
        id: publish
        run: |
          if [ -f public/index.html ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Pages
        if: steps.publish.outputs.deploy == 'true'
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.publish.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # deploy-pages looks the artifact up through the Actions artifacts
      # API. That index is eventually consistent: an immediate lookup can
      # report zero artifacts even though the upload succeeded (observed
      # on 2 of the first 4 deployments, with no relation to the gap
      # between steps). Poll the same API until the artifact is visible,
      # so the deploy starts against a settled index.
      - name: Wait for the Pages artifact
        if: steps.publish.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 30); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages")] | length' \
              2>/dev/null || echo 0)
            if [ "$count" -gt 0 ]; then
              echo "Pages artifact visible after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Pages artifact never became visible to the artifacts API"
          exit 1

      - name: Deploy Pages
        id: deploy
        if: steps.publish.outputs.deploy == 'true'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retrying the Pages deployment
        if: steps.publish.outputs.deploy == 'true' && steps.deploy.outcome == 'failure'
        run: sleep 10

      - name: Retry Pages deployment
        if: steps.publish.outputs.deploy == 'true' && steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

      # Exit codes 1 (models.dev failure) and 2 (degraded console scrape)
      # fail the job so GitHub sends its native failure notification email.
      - name: Propagate monitor exit code
        if: always() && steps.monitor.outputs.exit_code != ''
        run: |
          code="${{ steps.monitor.outputs.exit_code }}"
          exit "$code"
