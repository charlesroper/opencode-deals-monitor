name: Monitor

on:
  schedule:
    # Daily at 08:23 UTC, off the top of the hour to dodge cron jitter.
    - cron: "23 8 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild the public outputs even when nothing changed
        type: boolean
        default: false

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: opencode-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.publish.outputs.deploy }}
      exit_code: ${{ steps.monitor.outputs.exit_code }}
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Run the monitor
        id: monitor
        env:
          PUBLIC_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          FORCE_FLAG: ${{ inputs.force == true && '--force' || '' }}
        run: |
          set +e
          if [ "$FORCE_FLAG" = "--force" ]; then
            uv run opencode-monitor --force
          else
            uv run opencode-monitor
          fi
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit state changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/)" ]; then
            git add data/
            git commit -m "chore: update monitor state"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      # GitHub disables scheduled workflows after 60 days without repo
      # activity; push an empty commit well before that can happen.
      - name: Keepalive
        if: steps.commit.outputs.pushed != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          age_days=$(( (now - last) / 86400 ))
          if [ "$age_days" -ge 45 ]; then
            git commit --allow-empty -m "chore: keepalive scheduled monitor"
            git push
          fi

      - name: Check for publishable output
        id: publish
        run: |
          if [ -f public/index.html ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Pages
        if: steps.publish.outputs.deploy == 'true'
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.publish.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # Exit codes 1 (models.dev failure) and 2 (degraded console scrape)
      # fail the workflow so GitHub sends its native failure notification.
      # A degraded run (2) still has publishable output, so its exit code
      # travels to the deploy job and fails the workflow only after the
      # deployment has happened.
      - name: Propagate monitor exit code when nothing is deployed
        if: always() && steps.publish.outputs.deploy != 'true' && steps.monitor.outputs.exit_code != ''
        run: |
          code="${{ steps.monitor.outputs.exit_code }}"
          exit "$code"

  deploy:
    needs: monitor
    if: needs.monitor.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      # deploy-pages looks the artifact up through the Actions artifacts
      # API. That index is eventually consistent: an immediate lookup can
      # report zero artifacts even though the upload succeeded (observed
      # upstream in actions/deploy-pages#451). The separate deploy job
      # already gives the index seconds to settle; the poll makes the
      # guarantee explicit.
      - name: Wait for the Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 30); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages")] | length' \
              2>/dev/null || echo 0)
            if [ "$count" -gt 0 ]; then
              echo "Pages artifact visible after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Pages artifact never became visible to the artifacts API"
          exit 1

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retrying the Pages deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 10

      - name: Retry Pages deployment
        if: steps.deployment.outcome == 'failure'
        id: retry
        uses: actions/deploy-pages@v4

      # Publish first, then fail: a degraded run (2) must update the site
      # with its stale-data notice before the workflow reports failure.
      - name: Propagate monitor exit code
        if: always() && needs.monitor.outputs.exit_code != '' && needs.monitor.outputs.exit_code != '0'
        run: |
          code="${{ needs.monitor.outputs.exit_code }}"
          exit "$code"
