name: Monitor failure wiring test

# Throwaway copy of monitor.yml used to exercise the exit-code wiring
# against real GitHub Actions runs. Differences from production:
# - manual dispatch only, with a failure-injection input
# - no state commit / keepalive steps (test runs must not push state)
# Everything else (job outputs, artifact upload, poll, deploy, retry,
# exit-code propagation) matches monitor.yml.

on:
  workflow_dispatch:
    inputs:
      fail_mode:
        description: "Which failure to inject"
        type: choice
        options:
          - fatal
          - degraded
        default: fatal

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: opencode-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.publish.outputs.deploy }}
      exit_code: ${{ steps.monitor.outputs.exit_code }}
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Run the monitor
        id: monitor
        env:
          PUBLIC_BASE_URL: https://charlesroper.github.io/opencode-deals-monitor
          FAIL_MODE: ${{ inputs.fail_mode }}
        run: |
          set +e
          if [ "$FAIL_MODE" = "fatal" ]; then
            export MODELS_API_URL="https://models.invalid/api.json"
          elif [ "$FAIL_MODE" = "degraded" ]; then
            export CONSOLE_GO_URL="https://console.invalid/console/go"
          fi
          uv run opencode-monitor --force
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Check for publishable output
        id: publish
        run: |
          if [ -f public/index.html ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Pages
        if: steps.publish.outputs.deploy == 'true'
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.publish.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Propagate monitor exit code when nothing is deployed
        if: always() && steps.publish.outputs.deploy != 'true' && steps.monitor.outputs.exit_code != ''
        run: |
          code="${{ steps.monitor.outputs.exit_code }}"
          exit "$code"

  deploy:
    needs: monitor
    if: needs.monitor.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - name: Wait for the Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 30); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages")] | length' \
              2>/dev/null || echo 0)
            if [ "$count" -gt 0 ]; then
              echo "Pages artifact visible after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Pages artifact never became visible to the artifacts API"
          exit 1

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retrying the Pages deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 10

      - name: Retry Pages deployment
        if: steps.deployment.outcome == 'failure'
        id: retry
        uses: actions/deploy-pages@v4

      - name: Propagate monitor exit code
        if: always() && needs.monitor.outputs.exit_code != '' && needs.monitor.outputs.exit_code != '0'
        run: |
          code="${{ needs.monitor.outputs.exit_code }}"
          exit "$code"
